name: Tests

# Runs the domain + migration tests on both long-lived branches (see
# CLAUDE.md "Branches"): main (the core app) and server (the server-side
# work in design/ACCOUNTS-SYNC-ROADMAP.md). deploy-pages.yml also tests
# before deploying, but only on main. This one also covers server and every
# pull request into either branch. server/'s own tests run once server/
# has a package.json with a test script.

on:
  push:
    branches: [main, server]
  pull_request:
    branches: [main, server]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: server/'s tests use the built-in node:sqlite as a stand-in for D1.
          node-version: 22
      - name: Core tests (builds the bundle first via pretest)
        run: npm test
      - name: Server tests
        if: hashFiles('server/package.json') != ''
        working-directory: server
        run: |
          npm install
          npm test --if-present
