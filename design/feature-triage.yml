# feature-triage.yml — the triage list for every feature ever documented
# for GMAtlas that isn't built (as of 2026-11-08).
#
# How to use it: move each item out of `pending` into one of the four
# sections by cutting and pasting the whole entry. Once `pending` is empty,
# Claude acts on it:
#   defer   — keep, but out of the current plan. Recorded in an ADR as
#             deferred (like design/adr/deferred-turn-and-realtime-
#             collaboration.md), removed from every "what's missing" list.
#   add     — build it. Goes into the roadmap (functional-requirements-v3
#             or the accounts roadmap) in the order listed here.
#   ignore  — not wanted. Removed from every doc that describes it as
#             planned or missing; left alone where it's only history
#             (PROGRESS.md log entries, sessions/, git history).
#   delete  — remove from code AND documentation: dead code, stubs and the
#             docs that describe them. Schema stubs are removed only through
#             a migration that keeps old exports importable (rule 5).
#
# The goal: design/adr/ (and the Constitution's Part IV) describes only what
# exists, plus explicit deferral ADRs; nothing else claims a feature is
# planned unless it's under `add`.
#
# Entry fields: id (stable, for reference), title, sources (where it's
# documented), state (not-built | partial | stub | dead-code), notes.

defer:
  - id: turn-relay
    title: TURN relay for device-to-device transfer
    sources: [design/adr/deferred-turn-and-realtime-collaboration.md, ACCOUNTS-SYNC-ROADMAP D7]
    state: partial
    notes: Wired end to end except the Cloudflare key. Deferred 2026-11-08.
  - id: realtime-collaboration
    title: Real-time collaboration (S5 multiplayer tables, players, reveal-to-table, full presence, rolls/chat, cross-account documents, Yjs co-typing, table load tests)
    sources: [design/adr/deferred-turn-and-realtime-collaboration.md, ACCOUNTS-SYNC-ROADMAP S5/S6, functional-requirements-v3 Content Library recommendations]
    state: not-built
    notes: Deferred 2026-11-08. Groundwork (room, merge, per-campaign keys, table/player scopes, tables flag) stays.

add:
  - id: s4-store-billing
    title: S4 store and billing, provider-neutral
    sources: [ACCOUNTS-SYNC-ROADMAP S4, section 8.3, section 9]
    state: not-built
    notes: Owner's decision 2026-11-08 — catalog, synced cart, checkout behind an adapter with a fake provider, orders, webhooks to entitlements, receipts, Billing page, redeem codes, Products/Orders/Codes in admin. Real provider chosen later.

ignore: []

delete: []

